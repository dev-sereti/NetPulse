version: '3.8'

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: network-monitor-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./config/influxdb:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=network-monitor
      - DOCKER_INFLUXDB_INIT_BUCKET=network-metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.2.0
    container_name: network-monitor-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    depends_on:
      - influxdb
    networks:
      - monitoring

  network-monitor:
    build: .
    container_name: network-monitor-app
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
      - INFLUXDB_ORG=network-monitor
      - INFLUXDB_BUCKET=network-metrics
    depends_on:
      - influxdb
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
